spring.application.name=enterprise-content-management

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ecmdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ecm}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ecm_dev_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Document file storage
app.storage.location=${STORAGE_LOCATION:./uploads}

# Maximum upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB