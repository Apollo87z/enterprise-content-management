name: Backend CI/CD

on:
  push:
    branches:
      - "feature/**"
      - dev-backend
      - main

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and Build Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ecmdb
          POSTGRES_USER: ecm
          POSTGRES_PASSWORD: ecm_ci_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ecm -d ecmdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run Maven tests and build
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/ecmdb
          SPRING_DATASOURCE_USERNAME: ecm
          SPRING_DATASOURCE_PASSWORD: ecm_ci_password
        run: bash ./mvnw -B clean verify

      - name: Build Docker image
        run: docker build -t ecm-backend:ci ./backend

  promote-to-dev:
    name: Merge Feature and Delete Branch
    needs: test-and-build
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge into dev-backend
        env:
          FEATURE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev-backend
          git switch -C dev-backend origin/dev-backend
          git merge --no-edit "$FEATURE_SHA"
          git push origin HEAD:dev-backend

      - name: Delete remote feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURE_BRANCH: ${{ github.ref_name }}
          FEATURE_SHA: ${{ github.sha }}
        run: |
          CURRENT_SHA=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/${FEATURE_BRANCH}" \
            --jq '.object.sha')

          if [ "$CURRENT_SHA" != "$FEATURE_SHA" ]; then
            echo "Branch has newer commits. Skipping deletion."
            exit 0
          fi

          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/${FEATURE_BRANCH}"

  publish-ghcr:
    name: Publish Docker Image to GHCR
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
