
name: java-ecm

services:
  postgres:
    image: postgres:17
    container_name: ecm-postgres
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ecmdb
      POSTGRES_USER: ecm
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ecm-backend:local
    container_name: ecm-backend
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecmdb
      SPRING_DATASOURCE_USERNAME: ecm
      STORAGE_LOCATION: /app/uploads
    volumes:
      - document_storage:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:8080/api/v1/health > /dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  collabora:
    image: collabora/code:latest
    container_name: ecm-collabora
    ports:
      - "127.0.0.1:9981:9980"
    environment:
      aliasgroup1: "http://backend:8080"
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=false
    volumes:
      - ./backend/collabora/coolwsd.xml:/etc/coolwsd/coolwsd.xml:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ecm-frontend:local
    container_name: ecm-frontend
    env_file:
      - ./frontend/.env
    ports:
      - "127.0.0.1:5174:5173"
    depends_on:
      backend:
        condition: service_healthy
      collabora:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  document_storage:
